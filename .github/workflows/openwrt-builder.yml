- name: Initialization environment
      run: |
        # Đảm bảo cài thêm tmate ở đây cho chắc chắn
        sudo apt-get update
        sudo apt-get install -y tmate ack antlr3 asciidoc ... (giữ nguyên danh sách cũ của bạn)
        sudo timedatectl set-timezone "$TZ"

    # --- Phần SSH ---
    - name: SSH Connection (Tạm dừng để kiểm tra)
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: false
        install-dependencies: false
        tmate-server-host: ssh.tmate.io
