name: OpenWrt Builder

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /crypto /home/runner/admin
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison bzip2 ccache cmake flex g++ gawk gcc-multilib gettext git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip vim wget xmlto xz-utils zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown runner:runner /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Cache target Toolchain & Packages
      uses: actions/cache@v3
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir/host
          openwrt/staging_dir/toolchain-*
        key: ${{ runner.os }}-openwrt-cache-${{ hashFiles('openwrt/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-cache-

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Inject Meraki MX65W Hardware Base
      run: |
        cd openwrt
        rm -f .config
        
        # 1. Khóa cứng kiến trúc phần cứng Meraki MX65W (IPQ806x)
        echo "CONFIG_TARGET_ipq806x=y" > .config
        echo "CONFIG_TARGET_ipq806x_generic=y" >> .config
        echo "CONFIG_TARGET_ipq806x_generic_DEVICE_meraki_mx65w=y" >> .config
        
        # 2. Fix lỗi boot tịt nhân (Division by 0) - Ép driver gốc Non-CT
        echo "CONFIG_PACKAGE_kmod-ath10k=y" >> .config
        echo "CONFIG_PACKAGE_ath10k-firmware-qca9984=y" >> .config
        echo "# CONFIG_PACKAGE_kmod-ath10k-ct is not set" >> .config
        echo "# CONFIG_PACKAGE_ath10k-firmware-qca9984-ct is not set" >> .config
        
        # 3. Định dạng nén GZIP cho U-Boot Meraki
        echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y" >> .config
        echo "CONFIG_TARGET_KERNEL_COMP_GZIP=y" >> .config

        # 4. Kích hoạt driver điều khiển 12 cổng mạng (DSA Switch)
        echo "CONFIG_PACKAGE_kmod-dsa-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-dsa-qca8k=y" >> .config
        echo "CONFIG_PACKAGE_kmod-switch-qca83xx=y" >> .config
        echo "CONFIG_PACKAGE_kmod-8021q=y" >> .config

        # 5. Kích hoạt lõi điều khiển LED hệ thống
        echo "CONFIG_PACKAGE_kmod-leds-gpio=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ledtrig-netdev=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ledtrig-timer=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ledtrig-default-on=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ledtrig-heartbeat=y" >> .config

    - name: Load custom configuration & Apps
      run: |
        # Đưa cấu hình file gốc (.config nếu có) vào trước
        [ -e $CONFIG_FILE ] && cat $CONFIG_FILE >> openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        # Chạy script diy-part2 để nạp đống App và xử lý LED
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        # Đồng bộ hóa và cấu hình lại toàn bộ tùy chọn app
        make defconfig

    - name: Setup custom files
      run: |
        if [ -d "files" ]; then
          mv files openwrt/files
          echo "Đã di chuyển thư mục cấu hình files thành công!"
        fi

    - name: Setup tmate session (SSH Debug nếu cần)
      uses: mxschmitt/action-tmate@v3

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/
