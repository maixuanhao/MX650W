name: Build OpenWrt for Meraki MX65W

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4.2.2

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone OpenWrt Source Code
      run: |
        git clone --depth 1 https://github.com/immortalwrt/immortalwrt -b master openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Custom Configuration (.config)
      run: |
        [ -e .config ] && mv .config openwrt/.config
        cd openwrt
        make defconfig

    - name: Download Packages Source Code
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Set Default Theme to Argon
      run: |
        mkdir -p openwrt/files/etc/uci-defaults
        cat << 'EOF' > openwrt/files/etc/uci-defaults/99-argon-theme
        #!/bin/sh
        uci set luci.main.mediaurlbase='/luci-static/argon'
        uci set luci.main.lang='vi'
        uci commit luci
        exit 0
        EOF
        chmod +x openwrt/files/etc/uci-defaults/99-argon-theme

    - name: Compile Firmware
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload Firmware Artifacts
      uses: actions/upload-artifact@v4.4.3
      with:
        name: OpenWrt_Meraki_MX65W
        path: |
          openwrt/bin/targets/bcm53xx/generic/*.bin
          openwrt/bin/targets/bcm53xx/generic/*.manifest
        if-no-files-found: warn
